name: Nova AJ tests

on:
  push:
    branches:
      - main
      - feat/v285-context-policy
      - feat/v286-hardening
      - feat/v286-rebuild
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-aj-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
